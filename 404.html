<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b4438">
<title>صفحه پیدا نشد | اموات یاد</title>
<link rel="stylesheet" href="/amvatyad/assets/css/style.css">
<style>
.error-wrap{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 15%,rgba(178,139,80,.13),transparent 30%),var(--paper)}
.error-card{max-width:650px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(28px,6vw,58px);box-shadow:var(--shadow-lg)}
.error-code{font-size:clamp(54px,12vw,92px);font-weight:700;line-height:1;color:var(--gold);letter-spacing:-3px}
.error-card h1{font-size:clamp(23px,4vw,32px);color:var(--green-deep);margin:18px 0 12px}
.error-card p{color:var(--ink-soft);margin:0 auto 26px;max-width:470px}
.error-mark{width:58px;height:58px;object-fit:contain;margin:0 auto 18px}
</style>
</head>
<body>
<main class="error-wrap">
<section class="error-card">
<img class="error-mark" src="/amvatyad/images/logo-amvatyad.svg" alt="نشان اموات یاد">
<div class="error-code">۴۰۴</div>
<h1>این صفحه پیدا نشد</h1>
<p>ممکن است نشانی تغییر کرده باشد یا صفحه هنوز ساخته نشده باشد. از صفحه نخست می‌توانید مسیر درست را پیدا کنید.</p>
<a class="btn btn-primary" href="/amvatyad/index.html">بازگشت به اموات یاد</a>
</section>
</main>
</body>
</html>
