name: Import memorial image gallery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-memorial-gallery.yml'
      - 'images/GALLERY-IMPORT.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: "!startsWith(github.event.head_commit.message, 'Import memorial gallery assets')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Download licensed Commons images
        run: python .github/scripts/import_memorial_gallery.py
      - name: Commit downloaded images and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/gallery images/GALLERY-CREDITS.md
          if ! git diff --cached --quiet; then
            git commit -m "Import memorial gallery assets"
            git push
          fi
